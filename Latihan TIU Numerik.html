<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan TIU Numerik</title>
<style>
:root{--bg:#F3EEE4;--surface:#FFFDF8;--ink:#1B2233;--muted:#667085;--line:#E5DDCD;--accent:#D9531E;--accent-ink:#fff;--navy:#1F3A5F;--navy2:#2E6C8E;--ok:#2E7D52;--bad:#C0392B;--easy:#2E7D52;--med:#C58B1B;--hard:#C0392B;--ok-bg:#E6F3EB;--bad-bg:#FBEAE7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151C;--surface:#1B2029;--ink:#ECE9E1;--muted:#98A2B3;--line:#2C3342;--accent:#F0703A;--accent-ink:#1A1208;--navy:#1E3A5F;--navy2:#3A86A8;--ok:#4CAF6D;--bad:#EE7B6E;--easy:#4CAF6D;--med:#E5B04D;--hard:#EE7B6E;--ok-bg:#16301F;--bad-bg:#3A1D1A}}
:root[data-theme="dark"]{--bg:#12151C;--surface:#1B2029;--ink:#ECE9E1;--muted:#98A2B3;--line:#2C3342;--accent:#F0703A;--accent-ink:#1A1208;--navy:#1E3A5F;--navy2:#3A86A8;--ok:#4CAF6D;--bad:#EE7B6E;--easy:#4CAF6D;--med:#E5B04D;--hard:#EE7B6E;--ok-bg:#16301F;--bad-bg:#3A1D1A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:flex;justify-content:center;background:radial-gradient(1000px 420px at 50% -160px,color-mix(in srgb,var(--navy) 25%,transparent),transparent),var(--bg)}
.wrap{width:100%;max-width:660px;padding:24px 18px 56px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:22px;padding:26px 24px;margin-bottom:16px;box-shadow:0 10px 30px rgba(20,40,70,.22)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
h1{font-size:1.7rem;letter-spacing:-.02em;margin:6px 0 8px;line-height:1.15}
.hero p{margin:0 0 16px;opacity:.88;font-size:.95rem;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:rgba(255,255,255,.15);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:7px}
.d{width:9px;height:9px;border-radius:50%;background:#fff}.d.easy{background:#6EE7A0}.d.medium{background:#FBD36B}.d.hard{background:#FF9A8B}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(20,30,50,.07)}
h2{font-size:1rem;margin:0 0 12px}
.mode-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.mode-btn{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);text-align:left;cursor:pointer;font:inherit;transition:.15s}
.mode-btn .ico{font-size:1.6rem}.mode-btn strong{font-size:1rem}
.mode-btn em{font-style:normal;color:var(--muted);font-size:.85rem;line-height:1.4}
.mode-btn.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.primary{width:100%;padding:15px;border:none;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-top:6px;transition:transform .1s}
.primary:active{transform:scale(.98)}
.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.pbar,.tbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.pbar i,.tbar i{display:block;height:100%;width:0;border-radius:9px}
.pbar i{background:linear-gradient(90deg,var(--accent),#F2A03D);transition:width .4s}
.tbar{height:4px;margin-top:12px}.tbar i{background:var(--navy2);width:100%;transition:width 1s linear}.tbar.low i{background:var(--bad)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px}
.meta{display:flex;align-items:center;gap:10px}.progress{font-size:.85rem;color:var(--muted);font-weight:600}
.badge{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:999px;color:#fff}
.badge.easy{background:var(--easy)}.badge.medium{background:var(--med);color:#1a1a1a}.badge.hard{background:var(--hard)}
.timer{font-variant-numeric:tabular-nums;font-size:1.1rem;font-weight:800;padding:5px 14px;border-radius:999px;background:var(--navy);color:#fff}
.timer.low{background:var(--bad);animation:pulse 1s infinite}
.qtext{font-size:1.15rem;line-height:1.6;font-weight:500;margin:18px 0 20px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.98rem;cursor:pointer;line-height:1.45;transition:.15s}
.opt i{flex:0 0 30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem;color:var(--muted)}
.opt span{padding-top:4px}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--accent)}}
.opt.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.opt.selected i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}.opt.correct i{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}.opt.wrong i{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:14px 16px;border-radius:12px;border-left:4px solid;font-size:.93rem;line-height:1.55;animation:rise .3s ease both}
.explain.ok{background:var(--ok-bg);border-color:var(--ok)}.explain.bad{background:var(--bad-bg);border-color:var(--bad)}
.explain p{margin:6px 0 0;color:var(--muted)}
.nav-row{display:flex;gap:10px;margin-top:16px}.nav-row .primary{margin-top:0;flex:1}.nav-row .ghost{flex:0 0 32%}
.hidden{display:none!important}
.res-head{text-align:center;margin-bottom:8px}
.ring{position:relative;width:150px;height:150px;margin:0 auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:10}
.rb{stroke:var(--line)}.rf{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.rnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800}
.rnum small{font-size:1rem;color:var(--muted);font-weight:600;margin-left:2px}
.msg{font-size:1.1rem;font-weight:700;margin:0}.score-sub{color:var(--muted);margin:4px 0 16px;font-size:.9rem}
.review-item{border-left:4px solid var(--line);padding:12px 14px;margin-top:12px;border-radius:0 12px 12px 0;background:color-mix(in srgb,var(--line) 30%,transparent);font-size:.92rem;line-height:1.5}
.review-item.ok{border-color:var(--ok)}.review-item.bad{border-color:var(--bad)}
.review-tag{font-weight:800;margin-bottom:4px}.review-tag.ok{color:var(--ok)}.review-tag.bad{color:var(--bad)}
.review-q{margin-bottom:6px;white-space:pre-wrap}.exp{color:var(--muted);margin-top:6px}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:24px}
.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (max-width:480px){.wrap{padding:14px 12px 48px}.hero{padding:22px 18px}h1{font-size:1.45rem}.card{padding:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <span class="eyebrow">TIU · Numerik</span>
    <h1>Latihan Soal TIU Numerik</h1>
    <p>14 soal pilihan ganda: berhitung pecahan, perbandingan kuantitas, pola bilangan, dan soal cerita.</p>
    <div class="chips"><span><i class="d easy"></i>Mudah · 1 mnt</span><span><i class="d medium"></i>Sedang · 3 mnt</span><span><i class="d hard"></i>Sulit · 5 mnt</span></div>
  </header>

  <div id="start" class="card">
    <h2>Pilih mode pengerjaan</h2>
    <div class="mode-row">
      <button class="mode-btn active" id="modeTimed"><span class="ico">⏱️</span><strong>Dengan Timer</strong><em>Soal diacak. Waktu per soal mengikuti tingkat kesulitan.</em></button>
      <button class="mode-btn" id="modePractice"><span class="ico">🌱</span><strong>Latihan Bebas</strong><em>Tanpa waktu. Setelah menjawab, penjelasan langsung muncul.</em></button>
    </div>
    <button class="primary" id="btnStart">Mulai Latihan →</button>
  </div>

  <div id="quiz" class="card hidden">
    <div class="pbar"><i id="pbar"></i></div>
    <div class="topbar">
      <div class="meta"><span class="progress" id="progress"></span><span class="badge" id="diffBadge"></span></div>
      <span id="timerBox" class="timer">01:00</span>
    </div>
    <div id="timeRow" class="tbar"><i id="tbar"></i></div>
    <p class="qtext" id="qtext"></p>
    <div id="opts"></div>
    <div id="explain" class="explain hidden"></div>
    <div class="nav-row">
      <button class="primary ghost" id="btnQuit">Keluar</button>
      <button class="primary" id="btnNext">Lanjut</button>
    </div>
  </div>

  <div id="result" class="card hidden">
    <div class="res-head">
      <div class="ring"><svg viewBox="0 0 120 120"><circle class="rb" cx="60" cy="60" r="52"/><circle class="rf" id="rf" cx="60" cy="60" r="52"/></svg><div class="rnum" id="scoreBig"></div></div>
      <p class="msg" id="msg"></p>
      <p class="score-sub" id="scoreSub"></p>
    </div>
    <button class="primary" id="btnRetry">Ulangi Latihan</button>
    <div id="reviewList"></div>
  </div>

  <footer>Latihan mandiri — bukan sesi ujian resmi.</footer>
</div>

<script>
const QUESTIONS = [
 {no:37, diff:'easy', q:'1/5 ÷ 5 + 1/4 × 8 − 0,04 = ….', opts:['1','2','3','4','5'], ans:1,
  exp:'(1/5 ÷ 5) = 0,04. (1/4 × 8) = 2. Maka 0,04 + 2 − 0,04 = 2.'},
 {no:34, diff:'easy', q:'Manakah nilai berikut yang terbesar?\nA. 6% dari 8   B. 24% dari 2   C. 9% dari 6   D. 3% dari 14   E. 7% dari 7', opts:['6% dari 8 (=0,48)','24% dari 2 (=0,48)','9% dari 6 (=0,54)','3% dari 14 (=0,42)','7% dari 7 (=0,49)'], ans:2,
  exp:'Kalikan langsung angka pada tiap opsi (abaikan %): 6×8=48, 24×2=48, 9×6=54, 3×14=42, 7×7=49. Hasil terbesar: 9×6=54.'},
 {no:48, diff:'easy', q:'37, 41, 46, 52, 59, 67, ….', opts:['72','73','74','75','76'], ans:4,
  exp:'Selisih antar suku naik 1 tiap langkah: 4,5,6,7,8. Selisih berikutnya = 9, maka 67+9 = 76.'},
 {no:42, diff:'easy', q:'Jika 8 orang pekerja dapat menyelesaikan sebuah pekerjaan dalam 3 jam, berapa lamakah pekerjaan tersebut dapat diselesaikan oleh 3 orang pekerja?', opts:['4 jam','6 jam','8 jam','9 3/5 jam','10 5/6 jam'], ans:2,
  exp:'Total kerja = 8×3 = 24 orang-jam. Untuk 3 orang: 24÷3 = 8 jam.'},
 {no:45, diff:'easy', q:'Untuk membuat satu kue brownis, Ikul memerlukan setengah kilogram tepung dan tiga ratus gram margarin. Jika Ikul mempunyai dua ribu gram margarin dan tiga setengah kilogram tepung, maka banyak maksimal kue brownis yang bisa dibuat adalah ….', opts:['5 kue','6 kue','7 kue','8 kue','9 kue'], ans:1,
  exp:'Tepung: 3500÷500=7 kue. Margarin: 2000÷300=6,67→6 kue. Faktor pembatas = margarin, jadi maksimal 6 kue.'},
 {no:43, diff:'medium', q:'Ana dan Ani ditugaskan membuat kerajinan tangan. Ana butuh 20 menit, Ani butuh 30 menit. Berapa waktu jika dikerjakan bersama-sama?', opts:['5 menit','6 menit','12 menit','15 menit','10 menit'], ans:2,
  exp:'Rumus kerja gabungan: (a×b)/(a+b) = (20×30)/50 = 12 menit.'},
 {no:39, diff:'medium', q:'A = 1/6 × 20\nB = 12 2/4% × 20\nHubungan A dan B yang benar adalah ….', opts:['A = B','A < B','A > B','A = 2B','2A = B'], ans:2,
  exp:'A = 20/6 ≈ 3,33. B = 12,5% × 20 = 2,5. Karena 3,33 > 2,5 maka A > B.'},
 {no:41, diff:'medium', q:'Jika x = 17 + 13 dan y = 16 × 2, maka hubungan x dan y yang benar adalah ….', opts:['1/3 x = 1/2 y','1/5 x > 1/4 y','1/3 x < 1/4 y','1/6 x < 1/4 y','1/5 x > 1/4 y'], ans:3,
  exp:'x=30, y=32. Cek opsi D: 1/6×30=5 dan 1/4×32=8 → 5<8 benar.'},
 {no:36, diff:'medium', q:'4 × 1/3 − 5/6 + 1/9 ÷ 1/6 = ….', opts:['2 1/6','5/6','1/6','1 2/6','1 1/6'], ans:4,
  exp:'4×1/3=4/3. 1/9÷1/6=6/9=2/3. Samakan penyebut 6: 8/6−5/6+4/6=7/6=1 1/6.'},
 {no:35, diff:'medium', q:'1/5 × 1 7/8 + 1/4 ÷ 1 2/3 = ….', opts:['9/20','11/20','18/40','21/40','25/40'], ans:3,
  exp:'1/5×15/8=3/8. 1/4÷5/3=1/4×3/5=3/20. Samakan penyebut 40: 15/40+6/40=21/40.'},
 {no:40, diff:'hard', q:'Sebuah tangki berkapasitas 560 liter diisi pompa dengan laju 4 liter/menit.\nX = waktu mengisi tangki sampai penuh\nY = 2 jam 15 menit\nManakah hubungan yang benar antara X dan Y?', opts:['2X < Y','2X = Y','X = 2Y','X < Y','X > Y'], ans:4,
  exp:'X = 560÷4 = 140 menit (2 jam 20 menit). Y = 135 menit. Karena 140 > 135, maka X > Y.'},
 {no:38, diff:'hard', q:'P = 15/6 − 2×9/4 + 6\nQ = 45÷9/8 − 5/4×28\nHubungan P dan Q yang benar adalah ….', opts:['3P < 2Q','4P < 3Q','2P < 4Q','3P > 5Q','2P > 3Q'], ans:2,
  exp:'P = 2,5−4,5+6 = 4. Q = 40−35 = 5. Cek opsi C: 2P=8, 4Q=20 → 8<20 benar.'},
 {no:46, diff:'hard', q:'4, 2, 2/3, 1/3, …, ….', opts:['1/4, 2/4','1/6, 1/9','1/5, 1/9','1/9, 1/18','1/9, 1/12'], ans:3,
  exp:'Pola bergantian ÷2, ÷3, ÷2, ÷3…: 1/3÷3=1/9, lalu 1/9÷2=1/18.'},
 {no:44, diff:'hard', q:'Untuk membangun sebuah gedung diperlukan 45 pekerja dalam waktu 90 hari. Setelah 40 hari pengerjaan, cuaca memburuk sehingga proyek berhenti 14 hari. Agar selesai tepat waktu, berapa minimal pekerja yang harus ditambah?', opts:['63 orang','54 orang','36 orang','18 orang','10 orang'], ans:3,
  exp:'Total kerja=45×90=4050 orang-hari. Sudah selesai=45×40=1800. Sisa=2250 orang-hari. Sisa waktu=(90−40)−14=36 hari. Butuh=2250÷36=62,5→63 orang. Tambahan=63−45=18 orang.'}
];
const TIME = {easy:60, medium:180, hard:300};
const DIFF_LABEL = {easy:'Mudah', medium:'Sedang', hard:'Sulit'};

let mode = 'timed';
let idx = 0, score = 0, timerId = null, timeLeft = 0;
let answers = new Array(QUESTIONS.length).fill(null);

const els = {
  start: document.getElementById('start'), quiz: document.getElementById('quiz'), result: document.getElementById('result'),
  modeTimed: document.getElementById('modeTimed'), modePractice: document.getElementById('modePractice'),
  btnStart: document.getElementById('btnStart'), progress: document.getElementById('progress'),
  timerBox: document.getElementById('timerBox'), diffBadge: document.getElementById('diffBadge'),
  qtext: document.getElementById('qtext'), opts: document.getElementById('opts'),
  btnNext: document.getElementById('btnNext'), btnQuit: document.getElementById('btnQuit'),
  scoreBig: document.getElementById('scoreBig'), scoreSub: document.getElementById('scoreSub'),
  btnRetry: document.getElementById('btnRetry'), reviewList: document.getElementById('reviewList')
};

els.modeTimed.onclick = () => setMode('timed');
els.modePractice.onclick = () => setMode('practice');
function setMode(m){
  mode = m;
  els.modeTimed.classList.toggle('active', m==='timed');
  els.modePractice.classList.toggle('active', m==='practice');
}

const $=id=>document.getElementById(id);
const L=['A','B','C','D','E'], RING=2*Math.PI*52;
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let Q=[], total=60;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

els.btnStart.onclick = () => {
  Q = mode==='timed' ? shuffle(QUESTIONS.slice()) : QUESTIONS.slice();
  idx=0; score=0; answers.fill(null);
  els.start.classList.add('hidden'); showQuestion();
};
els.btnRetry.onclick = () => { els.result.classList.add('hidden'); els.start.classList.remove('hidden'); };
els.btnQuit.onclick = () => { clearInterval(timerId); els.quiz.classList.add('hidden'); els.start.classList.remove('hidden'); };

function showQuestion(){
  clearInterval(timerId);
  els.quiz.classList.remove('hidden'); els.result.classList.add('hidden');
  const q=Q[idx], timed=mode==='timed';
  els.progress.textContent='Soal '+(idx+1)+' / '+Q.length;
  $('pbar').style.width=(idx/Q.length*100)+'%';
  els.diffBadge.textContent=DIFF_LABEL[q.diff];
  els.diffBadge.className='badge '+q.diff;
  els.qtext.textContent=q.q;
  els.opts.innerHTML='';
  q.opts.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.innerHTML='<i>'+L[i]+'</i><span></span>';
    b.lastChild.textContent=opt; b.onclick=()=>selectOpt(i);
    els.opts.appendChild(b);
  });
  $('explain').classList.add('hidden');
  updateSelectedUI();
  els.btnNext.textContent=idx===Q.length-1?'Selesai':'Lanjut';
  [els.timerBox,$('timeRow')].forEach(e=>e.classList.toggle('hidden',!timed));
  if(timed){ total=timeLeft=TIME[q.diff]; tickTimer(); timerId=setInterval(tickTimer,1000); }
  els.quiz.classList.remove('enter'); void els.quiz.offsetWidth; els.quiz.classList.add('enter');
}
function tickTimer(){
  els.timerBox.textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(timeLeft%60).padStart(2,'0');
  const low=timeLeft<=10;
  els.timerBox.classList.toggle('low',low); $('tbar').parentNode.classList.toggle('low',low);
  $('tbar').style.width=(timeLeft/total*100)+'%';
  if(timeLeft<=0){ clearInterval(timerId); goNext(); return; }
  timeLeft--;
}
function selectOpt(i){
  if(mode==='practice'){ if(answers[idx]!==null) return; answers[idx]=i; reveal(); return; }
  answers[idx]=i; updateSelectedUI();
}
function reveal(){
  const q=Q[idx], a=answers[idx], ok=a===q.ans;
  [...els.opts.children].forEach((b,i)=>{ b.disabled=true; b.classList.toggle('correct',i===q.ans); b.classList.toggle('wrong',i===a&&!ok); });
  const ex=$('explain');
  ex.className='explain '+(ok?'ok':'bad');
  ex.innerHTML='<strong>'+(ok?'✓ Benar!':'✗ Belum tepat — kunci: '+L[q.ans])+'</strong><p></p>';
  ex.lastChild.textContent=q.exp;
}
function updateSelectedUI(){ [...els.opts.children].forEach((b,i)=>b.classList.toggle('selected',answers[idx]===i)); }
els.btnNext.onclick=goNext;
function goNext(){ clearInterval(timerId); if(idx<Q.length-1){ idx++; showQuestion(); } else finish(); }
function finish(){
  const n=Q.length; score=Q.filter((q,i)=>answers[i]===q.ans).length;
  const blank=answers.filter(a=>a===null).length, r=score/n;
  els.quiz.classList.add('hidden'); els.result.classList.remove('hidden');
  els.scoreBig.innerHTML=score+'<small>/'+n+'</small>';
  els.scoreSub.textContent=score+' benar · '+(n-score-blank)+' salah · '+blank+' kosong';
  $('msg').textContent=r>=.8?'Mantap, pertahankan!':r>=.5?'Sudah bagus, tinggal dipoles.':'Ayo ulangi — pembahasan ada di bawah.';
  const rf=$('rf'); rf.style.strokeDashoffset=RING;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ rf.style.strokeDashoffset=RING*(1-r); }));
  els.reviewList.innerHTML='';
  Q.forEach((q,i)=>{
    const ok=answers[i]===q.ans, div=document.createElement('div');
    div.className='review-item '+(ok?'ok':'bad');
    const ua=answers[i]===null?'Tidak dijawab':L[answers[i]]+'. '+q.opts[answers[i]];
    div.innerHTML='<div class="review-tag '+(ok?'ok':'bad')+'">Soal No '+q.no+' — '+(ok?'Benar':'Salah')+'</div><div class="review-q">'+esc(q.q)+'</div><div>Jawabanmu: '+esc(ua)+'</div><div>Kunci: '+L[q.ans]+'. '+esc(q.opts[q.ans])+'</div><div class="exp">'+esc(q.exp)+'</div>';
    els.reviewList.appendChild(div);
  });
}
</script>
</body>
</html>
